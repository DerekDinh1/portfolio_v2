<html lang="en" data-time="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Derek Dinh — IT operator who turns messy processes into measurable, automated systems. 8+ years across high-growth tech companies. Choose a starter."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"

      try {

      } catch (e) {}
    </script>
